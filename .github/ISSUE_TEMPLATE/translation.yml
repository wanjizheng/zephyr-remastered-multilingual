name: 翻译校对建议 / Translation suggestion
description: 提交对白修改建议 / Suggest an improvement to a translated line
title: "[Translation / 翻译校对] "
body:
  - type: dropdown
    id: language
    attributes:
      label: 目标语言 / Target language
      options:
        - zh-Hans（简体中文）
        - zh-Hant（繁體中文）
        - en（English）
        - 多语言 / Multiple（每条记录必须包含语言）
    validations:
      required: true
  - type: markdown
    attributes:
      value: "教程 / Tutorial: https://github.com/wanjizheng/zephyr-remastered-zh-cn/blob/main/docs/dialogue-review.en.md 。从助手导出修改包并附在下方。Export suggestions from Dialogue review and attach the ZIP below. 请勿附游戏资源、程序或存档 / Do not attach game assets, executables, or saves."
  - type: textarea
    id: suggestions
    attributes:
      label: 修改内容与定位信息 / Suggestions and context
      description: 粘贴助手生成的内容，或说明场景、原文、建议和原因。Paste the generated issue text, or describe the scene, original line, suggestion, and reason. Missing line IDs are OK for manual reports.
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: 导出的 JSON 或 ZIP / Exported JSON or ZIP
      description: 附上导出包或必要截图 / Attach your exported package or relevant screenshots.
  - type: input
    id: version
    attributes:
      label: 游戏 / 汉化版本 · Game / patch version
      placeholder: e.g. patch v0.4.4; include the exported version details if unsure
