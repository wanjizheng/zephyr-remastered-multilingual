name: 翻译校对建议
description: 提交带有台词 key 和资源定位的修改建议
title: "[翻译校对] "
body:
  - type: dropdown
    id: language
    attributes:
      label: 目标语言 / Target language
      options:
        - zh-Hans（简体中文）
        - zh-Hant（繁體中文）
        - en（English）
        - 多语言 / Multiple（每条记录必须包含语言）
    validations:
      required: true
  - type: markdown
    attributes:
      value: "在对白校对助手中填写建议，选择“导出修改包”，将 ZIP 拖入下方。请勿附上游戏资源包、程序文件或存档。"
  - type: textarea
    id: suggestions
    attributes:
      label: 修改内容与定位信息
      description: 粘贴助手生成的 Issue 内容；手动提交请包含目标语言、语言包版本/哈希、fieldID、key、原文、建议译文及原因。
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: 导出的 JSON 或 ZIP
      description: 拖入助手导出的修改包，便于维护者精确定位与核对版本。
  - type: input
    id: version
    attributes:
      label: 游戏 / 汉化版本
      placeholder: 如不清楚，请保留导出中的 GameAssembly SHA-256
